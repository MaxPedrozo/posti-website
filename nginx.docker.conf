# nginx config INSIDE the container. No server_name/SSL here --
# Traefik (outside, on the host) owns the domain and the TLS
# certificate; this just needs to answer plain HTTP on :80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
                application/xml+rss application/atom+xml image/svg+xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /robots.txt { allow all; log_not_found off; access_log off; }
    location = /sitemap.xml { allow all; log_not_found off; access_log off; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
