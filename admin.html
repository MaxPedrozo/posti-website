<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSTI | Content Management Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .ql-container { font-size: 16px; border-bottom-left-radius: 0.75rem; border-bottom-right-radius: 0.75rem; min-height: 300px; }
        .ql-toolbar { border-top-left-radius: 0.75rem; border-top-right-radius: 0.75rem; background: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-6 md:p-12">
    
    <div class="max-w-4xl mx-auto">
        <header class="mb-10 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900">Content Studio</h1>
                <p class="text-slate-500 text-sm mt-1">Strategic Journal Management System</p>
            </div>
            <div class="h-10 w-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg shadow-blue-200">P</div>
        </header>

        <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-100">
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Article Title</label>
                    <input type="text" id="title" placeholder="Enter post title..." 
                        class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:outline-none transition-all text-lg font-semibold">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Category</label>
                        <input type="text" id="category" placeholder="e.g. Engineering" 
                            class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Header Image Path</label>
                        <input type="text" id="image" placeholder="assets/images/header.jpg" 
                            class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Short Excerpt</label>
                    <textarea id="excerpt" placeholder="Brief summary for the home and blog feeds..." 
                        class="w-full p-4 bg-slate-50 border border-slate-100 rounded-xl h-24 focus:ring-2 focus:ring-blue-500/20 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Main Body Content</label>
                    <div id="editor" class="bg-white"></div>
                </div>

                <button onclick="publishPost()" id="publish-btn" 
                    class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-blue-600 transition-all flex items-center justify-center gap-3 group">
                    <span>Deploy Analysis</span>
                    <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        var quill = new Quill('#editor', {
            theme: 'snow',
            modules: { toolbar: [ [{ 'header': [1, 2, false] }], ['bold', 'italic'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], ['link', 'blockquote', 'code-block'], ['clean'] ] }
        });

        async function publishPost() {
            const btn = document.getElementById('publish-btn');
            btn.innerHTML = "Processing Deployment...";
            btn.disabled = true;
            
            const payload = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                excerpt: document.getElementById('excerpt').value,
                image: document.getElementById('image').value,
                content: quill.root.innerHTML
            };

            try {
                const response = await fetch('http://127.0.0.1:5000/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert("System Updated: Article is now live.");
                    location.reload();
                }
            } catch (e) {
                alert("Connection Error: Is the Flask server running?");
                btn.disabled = false;
                btn.innerHTML = "Deploy Analysis";
            }
        }
    </script>
</body>
</html>
