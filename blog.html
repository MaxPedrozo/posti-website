<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | POSTI Strategic Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        /* Smooth transition for dynamic loading */
        #blog-grid { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-white text-slate-900">

    <nav class="fixed w-full z-50 glass border-b border-slate-300">
        <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3 group transition-all duration-300 active:scale-95">
                    <img src="assets/logo.png" alt="POSTI Logo" class="h-12 md:h-20 w-auto group-hover:opacity-80 transition-opacity">
                    <span class="text-5xl font-bold tracking-tighter text-slate-900 group-hover:text-blue-600 transition-colors">POSTI</span>
                </a>
            </div>
            <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
                <a href="index.html#services" class="hover:text-blue-600 transition">Services</a>
                <a href="index.html#about" class="hover:text-blue-600 transition">About</a>
                <a href="#" class="text-blue-600 font-bold">Blog</a>
                <a href="index.html#contact" class="hover:text-blue-800 transition border-l pl-8 border-slate-200 font-bold text-blue-600">Contact us</a>
            </div>
        </div>
    </nav>

    <header class="pt-40 md:pt-48 pb-12 bg-slate-50 border-b border-slate-100 px-6">
        <div class="max-w-6xl mx-auto text-center">
            <span class="text-blue-600 font-bold tracking-[0.3em] uppercase text-[10px] md:text-xs">Knowledge Hub</span>
            <h1 class="text-4xl md:text-6xl font-bold mt-4 mb-8 tracking-tight">The Strategic <span class="text-slate-400">Journal.</span></h1>
            
            <div class="max-w-2xl mx-auto mt-12 flex flex-col gap-4 items-center">
                <div class="relative w-full">
                    <input type="text" id="searchBar" placeholder="Search insights..." class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>
    </header>

    <main class="py-12 md:py-20 px-6">
        <div class="max-w-6xl mx-auto">
            <div id="blog-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
                <div class="col-span-full text-center py-20">
                    <p class="text-slate-400 animate-pulse font-medium">Loading strategic insights...</p>
                </div>
            </div>
        </div>
    </main>

    <section class="py-16 md:py-20 bg-slate-900 text-white mx-4 md:mx-6 rounded-[2rem] md:rounded-[3rem] mb-20">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <h2 class="text-3xl md:text-4xl font-bold mb-4 tracking-tight">Stay ahead of the curve.</h2>
            <p class="text-slate-400 mb-10 text-sm md:text-base">Get our latest strategic insights delivered directly to your inbox.</p>
            <form class="flex flex-col sm:flex-row gap-4 max-w-lg mx-auto">
                <input type="email" placeholder="Corporate Email" class="flex-1 px-6 py-4 rounded-2xl bg-white/5 border border-white/10 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                <button class="bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-2xl font-bold transition-all transform active:scale-95">Subscribe</button>
            </form>
        </div>
    </section>

    <footer class="py-12 border-t border-slate-200 text-center text-slate-400 text-[10px] uppercase tracking-widest font-bold">
        <p>© 2026 POSTI - Strategic Tech Innovations. All rights reserved.</p>
    </footer>

    <script>
        /**
         * POSTI Dynamic Core
         * Pulls data from data.json and builds the UI.
         */
        async function loadStrategicJournal() {
            try {
                const syncID = Date.now();
                const response = await fetch(`data.json?v=${syncID}`, {
                    cache: 'no-store'
                });
                const posts = await response.json();
                const grid = document.getElementById('blog-grid');

                // Sorting by date (newest first) - consistent with index.html
                const sortedPosts = posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                grid.innerHTML = sortedPosts.map(post => {
                    // Precise date handling to avoid timezone issues
                    const [year, month, day] = post.date.split('-');
                    const localDate = new Date(year, month - 1, day);
                    const formattedDate = localDate.toLocaleDateString('en-US', { 
                        month: 'long', 
                        day: 'numeric', 
                        year: 'numeric' 
                    });

                    // Normalize image path
                    const cleanImage = post.image.replace(/\\/g, '/');

                    return `
                    <article class="group flex flex-col bg-slate-50 p-8 rounded-[2rem] border border-slate-200 hover:shadow-2xl transition-all duration-500">
                        <div class="mb-6 overflow-hidden rounded-2xl aspect-video bg-slate-200">
                            <img src="${cleanImage}" alt="${post.title}" class="w-full h-full object-cover">
                        </div>
                        <div class="mb-6 flex items-center justify-between text-[10px] uppercase tracking-widest font-bold">
                            <span class="text-blue-600">${post.category}</span>
                            <span class="text-slate-400">${formattedDate}</span>
                        </div>
                        <h3 class="text-2xl font-bold mb-4 group-hover:text-blue-600 transition-colors leading-tight">
                            ${post.title}
                        </h3>
                        <p class="text-slate-500 line-clamp-3 text-sm leading-relaxed mb-6 flex-grow">
                            ${post.excerpt}
                        </p>
                        <a href="${post.url}" class="inline-flex items-center gap-2 text-blue-600 font-bold text-sm hover:underline underline-offset-4">
                            Read Full Analysis 
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                        </a>
                    </article>
                    `;
                }).join('');
            } catch (error) {
                console.error('Core Error:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', loadStrategicJournal);
    </script>

</body>
</html>
